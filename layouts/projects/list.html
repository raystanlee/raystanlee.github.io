{{ partial "head.html" . }}

<body class="{{ .Site.Params.themeColor }} {{ if .Site.Params.layoutReverse }}layout-reverse{{ end }}">
  {{ partial "sidebar.html" . }}

  <div class="content container">
    <div class="post">
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      <div class="row" id="filterable-grid">
        {{ range .Pages }}
          {{ $groups := .Params.groups | default (slice (.Params.group | default "ml")) }}
          <div class="col-xs-6 col-md-6 col-lg-4
            {{ range $groups }}
              {{ if eq . "ml" }}grid-section-ml{{ end }}
              {{ if eq . "hardware" }}grid-section-hardware{{ end }}
              {{ if eq . "professional" }}grid-section-professional{{ end }}
            {{ end }}">
            <a href="{{ .RelPermalink }}" class="project-card-link">
              <div class="project-card">
                {{ with .Params.image }}
                <div class="project-card-image">
                  <img src="{{ . | relURL }}" alt="{{ $.Title }}">
                </div>
                {{ end }}
                <div class="project-card-title-container">
                  {{ .Title }}
                </div>
                {{ with .Params.subtitle }}
                <div class="project-card-subtitle">
                  {{ . }}
                </div>
                {{ end }}
              </div>
            </a>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
</body>
</html>
