{{ define "main" }}
<div class="post">
  <div class="post-content">
    <h1>{{ .Title }}</h1>

    {{ if .Params.subtitle }}
    <p class="project-subtitle" style="font-size: 1.2rem; color: #666; margin-bottom: 2rem;">{{ .Params.subtitle }}</p>
    {{ end }}

    {{ if .Params.image }}
    <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" style="max-width: 100%; height: auto; margin-bottom: 2rem; border-radius: 8px;">
    {{ end }}

    <div class="project-content">
      {{ .Content }}
    </div>

    <p style="margin-top: 3rem;">
      <a href="/" style="color: #0066cc; text-decoration: none;">← Back to Home</a>
    </p>
  </div>
</div>
{{ end }}
